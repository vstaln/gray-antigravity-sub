name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Check out sibling path dependencies
        shell: bash
        run: |
          grep -oE 'path *= *"\.\./[^"]+"' Cargo.toml | sed -E 's/.*"(\.\.\/[^"]+)".*/\1/' | while read -r dep; do
            name=$(basename "$dep")
            [ -d "$dep" ] || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/${name}" "$dep"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets -- --test-threads=1
